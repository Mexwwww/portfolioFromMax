<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Max Geurts - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6f8fa;
            color: #24292e;
        }

        .backgroundColor {
            background: #f6f8fa;
        }

        .cnt-white {
            width: 100%;
            border-bottom: 1px solid #e1e4e8;
            background: #ffffff;
            padding: 0.6rem 1rem;
            box-shadow: 0 1px 3px rgba(27, 31, 35, 0.04);
        }

        .layout-nav-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem 3rem;
            padding: 4px 16px;
            font-size: 0.95rem;
            font-family: 'Fira Code', monospace;
        }

        .btn-darkslate {
            color: #586069 !important;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            text-decoration: none;
            transition: all 0.15s ease;
        }

            .btn-darkslate:hover, a:hover {
                color: #0366d6 !important;
                background: rgba(3, 102, 214, 0.08);
                border-color: #e1e4e8;
                transform: translateY(-1px);
            }

        .slct-darkslate {
            color: #0366d6 !important;
            background: rgba(3, 102, 214, 0.1);
            border: 1px solid #c8e1ff;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            box-shadow: 0 1px 4px rgba(3, 102, 214, 0.15);
        }

        img, video {
            max-width: 100%;
            height: auto;
        }

        .contactWrapper {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6vh 1rem;
        }

        .divRight {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 4px 12px rgba(27, 31, 35, 0.05);
            color: #24292e;
            font-family: 'Inter', sans-serif;
        }

            .divRight h3 {
                font-family: 'Fira Code', monospace;
                color: #0366d6;
                margin-bottom: 1.5rem;
                text-align: center;
                font-size: 1.5rem;
            }

            .divRight label {
                color: #586069;
                margin-bottom: 0.4rem;
                display: inline-block;
                font-size: 0.9rem;
                font-family: 'Fira Code', monospace;
            }

            .divRight .form-control {
                background: #f6f8fa;
                border: 1px solid #e1e4e8;
                color: #24292e;
                border-radius: 6px;
                padding: 0.75rem;
                font-size: 0.95rem;
                transition: all 0.2s ease;
            }

                .divRight .form-control:focus {
                    background: #ffffff;
                    color: #24292e;
                    border-color: #0366d6;
                    box-shadow: 0 0 0 3px rgba(3, 102, 214, 0.15);
                }

            .divRight .form-group {
                margin-bottom: 1.25rem;
            }

            .divRight textarea.form-control {
                min-height: 130px;
                resize: vertical;
            }

        .envolope {
            display: block;
            margin: 1.5rem auto 0;
            max-width: 60px;
            height: auto;
            filter: invert(1) hue-rotate(180deg);
        }

        .divRight .btn-darkslate {
            background: #2ea44f;
            color: #ffffff;
            border: 1px solid rgba(27, 31, 35, 0.1);
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
        }

        .direct-contact-info {
            width: 100%;
            max-width: 480px;
            margin-top: 1.5rem;
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            color: #24292e;
            box-shadow: 0 4px 12px rgba(27, 31, 35, 0.03);
        }

        .direct-contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }

            .direct-contact-item svg {
                width: 16px;
                height: 16px;
                fill: #0366d6;
                flex-shrink: 0;
            }

            .direct-contact-item a {
                color: #0366d6;
                text-decoration: none;
            }

        .placeholder-text {
            color: #8c959f;
            font-style: italic;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="backgroundColor" onload="loadHeader(); OnLoad()">

    <div id="site-header"></div>

    <div class="contactWrapper">
        <div class="divRight">
            <div id="email-div">
                <h3>Get in Touch</h3>
                <div class="form-group">
                    <label for="senderEmail">Your email</label>
                    <input name="email" type="email" class="form-control" id="senderEmail" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="header">Subject</label>
                    <input name="header" type="text" class="form-control" id="header" placeholder="Project Inquiry / Subject">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" class="form-control" placeholder="Write your message here..."></textarea>
                </div>
                <div id="formError" class="text-danger mb-2" style="display: none; font-size: 0.85rem;"></div>
                <button type="button" onclick="SendMail()" class="btn btn-darkslate">Send Message</button>
            </div>
            <img src="images/mail_closed.png" alt="Envelope" class="envolope" id="envolope">
        </div>

        <div class="direct-contact-info">
            <div class="direct-contact-item">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z" /></svg>
                <span id="email-container"><span class="placeholder-text">Loading email...</span></span>
            </div>
            <div class="direct-contact-item">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" /></svg>
                <span id="phone-container"><span class="placeholder-text">Loading phone...</span></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        async function SendMail() {
        var email = document.querySelector('[name=email]').value.trim();
        var header = document.querySelector('[name=header]').value.trim();
        var message = document.querySelector('[name=message]').value.trim();
        var missing = [];
        if (!email) missing.push('your email');
        if (!header) missing.push('a subject');
        if (!message) missing.push('a message');
        var errorDiv = document.getElementById('formError');
        if (missing.length > 0) {
        errorDiv.textContent = 'Please fill in ' + missing.join(', ') + ' before sending.';
        errorDiv.style.display = 'block';
        return;
        }
        errorDiv.style.display = 'none';
        TriggerAnimation();
        }

        function TriggerAnimation() {
        const animatedObject = document.getElementById('email-div');
        const envolope = document.getElementById('envolope');
        animatedObject.classList.add('animate-mail-anim');
        envolope.classList.add('animate-envolope-anim');
        setTimeout(ClearFormFields, 8800);
        }

        function ClearFormFields() {
        document.querySelector('[name=email]').value = '';
        document.querySelector('[name=header]').value = '';
        document.querySelector('[name=message]').value = '';
        }

        document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
        const email = atob("bS50LmpuZ2V1cnRzQGdtYWlsLmNvbQ==");
        const phone = atob("KzMxIDYgNDIzNDg0NDI=");
        document.getElementById('email-container').innerHTML = '<a href="mailto:' + email + '">' + email + '</a>';
        document.getElementById('phone-container').innerHTML = '<a href="tel:' + phone.replace(/\s+/g, '') + '">' + phone + '</a>';
        }, 500);
        });

        document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' || event.code === 'Escape') { history.back(); }
        });

        function OnLoad() {
        let activeBtn = document.getElementById('contact');
        if (activeBtn) { activeBtn.setAttribute('class', 'btn slct-darkslate'); }
        }
    </script>
</body>
</html>
