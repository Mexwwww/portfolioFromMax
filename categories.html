<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Max Geurts - Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6f8fa;
            color: #24292e;
        }

        .cnt-white {
            width: 100%;
            border-bottom: 1px solid #e1e4e8;
            background: #ffffff;
            padding: 0.6rem 1rem;
            box-shadow: 0 1px 3px rgba(27, 31, 35, 0.04);
        }

        .layout-nav-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem 3rem;
            padding: 4px 16px;
            font-size: 0.95rem;
            font-family: 'Fira Code', monospace;
        }

        .btn-darkslate {
            color: #586069 !important;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            text-decoration: none;
            transition: all 0.15s ease;
        }

            .btn-darkslate:hover, a:hover {
                color: #0366d6 !important;
                background: rgba(3, 102, 214, 0.08);
                border-color: #e1e4e8;
                transform: translateY(-1px);
            }

        .slct-darkslate {
            color: #0366d6 !important;
            background: rgba(3, 102, 214, 0.1);
            border: 1px solid #c8e1ff;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            box-shadow: 0 1px 4px rgba(3, 102, 214, 0.15);
        }

        .categories-wrapper {
            display: flex;
            gap: 2rem;
            max-width: 1200px;
            margin: 6vh auto;
            padding: 0 1.5rem;
            align-items: stretch;
        }

        .divLeft {
            flex: 0 0 350px;
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            box-shadow: 0 4px 12px rgba(27, 31, 35, 0.05);
        }

        .divRight {
            flex: 1;
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(27, 31, 35, 0.05);
            min-height: 400px;
        }

        .category-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.85rem 1.2rem;
            border-radius: 8px;
            color: #586069;
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            text-decoration: none;
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            transition: all 0.2s ease;
            cursor: pointer;
            text-align: left;
            width: 100%;
        }

            .category-btn:hover, .category-btn.active {
                color: #0366d6;
                background: rgba(3, 102, 214, 0.08);
                border-color: #c8e1ff;
                transform: translateX(4px);
                box-shadow: 0 1px 4px rgba(3, 102, 214, 0.1);
            }

            .category-btn .icon {
                opacity: 0.5;
                color: #586069;
            }

            .category-btn:hover .icon, .category-btn.active .icon {
                opacity: 1;
                color: #0366d6;
            }

        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body onload="loadHeader(); initCategories()">

    <div id="site-header"></div>

    <div class="categories-wrapper">
        <div class="divLeft" id="categoryButtonsContainer"></div>
        <div class="divRight">
            <img src="" alt="Category Preview" id="preview">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script>
        let portfolioData = {};
        let directoryNames = [];
        let currentActiveCategory = '';
        let imageInterval = null;

        async function initCategories() {
        let activeBtn = document.getElementById('categories');
        if (activeBtn) { activeBtn.setAttribute('class', 'btn slct-darkslate'); }

        try {
        let response = await fetch('projects.json');
        portfolioData = await response.json();
        directoryNames = Object.keys(portfolioData);

        if (directoryNames.length > 0) {
        renderCategoryButtons();
        PreviewCategory(directoryNames[0]);
        imageInterval = setInterval(() => { PreviewCategory(currentActiveCategory); }, 3000);
        }
        } catch (error) {
        console.error('Failed to load projects.json for categories page:', error);
        }
        }

        function renderCategoryButtons() {
        let container = document.getElementById('categoryButtonsContainer');
        container.innerHTML = '';
        directoryNames.forEach(categoryName => {
        let btn = document.createElement('a');
        btn.className = 'category-btn';
        btn.id = categoryName;
        btn.href = `categorisedProjects.html#${categoryName}`;
        btn.onmouseover = () => PreviewCategory(categoryName);
        btn.innerHTML = `<span class="icon">&gt;</span><span>${categoryName}</span>`;
        container.appendChild(btn);
        });
        }

        function PreviewCategory(categoryName) {
        currentActiveCategory = categoryName;
        document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.id === categoryName) { btn.classList.add('active'); }
        else { btn.classList.remove('active'); }
        });
        ShowRandomImage(categoryName);
        }

        function ShowRandomImage(categoryName) {
        let projects = portfolioData[categoryName] || [];
        if (projects.length === 0) { document.getElementById('preview').src = ''; return; }
        let randomProj = projects[Math.floor(Math.random() * projects.length)];
        document.getElementById('preview').src = randomProj.image;
        }
    </script>
</body>
</html>
